<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adicionar Festa - Estica o Fole</title>

    <link rel="icon" href="esticaofole-favicon.jpg" sizes="32x32">

    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Montserrat, Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            max-width: 160px;
            width: 70%;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
        }

        .box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #fff;
            font-family: Montserrat, Arial, sans-serif;
            font-size: 16px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row > div {
            flex: 1;
        }

        button {
            width: 100%;
            min-height: 52px;
            margin-top: 20px;
            border: 0;
            border-radius: 8px;
            font-family: Montserrat, Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .save {
            background: #198754;
            color: white;
        }

        .token-save {
            background: #333;
            color: white;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }

        .agenda-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #555;
            text-decoration: none;
            font-weight: 600;
        }

        @media(max-width: 500px) {
            body {
                padding: 12px;
            }

            .box {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="logo.png" class="logo" alt="Estica o Fole">

        <h1>Adicionar Festa</h1>
    </div>

    <div class="box">

        <label for="githubToken">
            Token GitHub
        </label>

        <input
            type="password"
            id="githubToken"
            placeholder="github_pat_..."
        >

        <button
            type="button"
            class="token-save"
            onclick="guardarToken()"
        >
            Guardar token
        </button>

        <label for="local">
            Local
        </label>

        <input
            type="text"
            id="local"
            placeholder="Ex: Murça"
        >

        <div class="row">

            <div>
                <label for="day">Dia</label>

                <input
                    type="number"
                    id="day"
                    min="1"
                    max="31"
                >
            </div>

            <div>
                <label for="month">Mês</label>

                <select id="month">
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                    <option value="6">Junho</option>
                    <option value="7">Julho</option>
                    <option value="8">Agosto</option>
                    <option value="9">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>

        </div>

        <div class="row">

            <div>
                <label for="hour">Hora</label>

                <input
                    type="number"
                    id="hour"
                    min="0"
                    max="23"
                    value="0"
                >
            </div>

            <div>
                <label for="min">Minutos</label>

                <input
                    type="number"
                    id="min"
                    min="0"
                    max="59"
                    value="0"
                >
            </div>

        </div>

        <div class="row">

            <div>
                <label for="dinner">Jantar</label>

                <select id="dinner">
                    <option value="0">Não</option>
                    <option value="1">Sim</option>
                </select>
            </div>

            <div>
                <label for="fat">FAT</label>

                <select id="fat">
                    <option value="0">Não</option>
                    <option value="1">Sim</option>
                </select>
            </div>

        </div>

        <label for="sound">Som</label>

        <select id="sound">
            <option value="false">Sem som</option>
            <option value="true">Com som</option>
        </select>

        <label for="value">Valor €</label>

        <input
            type="number"
            id="value"
            min="0"
            value="0"
        >

        <button
            type="button"
            class="save"
            onclick="adicionarFestaGitHub()"
        >
            <i class="fa-solid fa-plus"></i>
            Adicionar festa
        </button>

        <div id="status" class="status"></div>

    </div>

    <a href="index.html" class="agenda-link">
        ← Voltar à agenda
    </a>

</div>

<script src="backoffice.js"></script>

</body>
</html>
